name: Bug Report
description: Report a bug, camera preview issue, or VIN scanner failure
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in Smart Capture. Please be as descriptive as possible.
  - type: input
    id: device
    attributes:
      label: Device & OS
      description: e.g. iPhone 15 Pro (iOS 17.4 Safari), Samsung Galaxy S23 (Chrome 122), MacBook Pro (Desktop Chrome)
      placeholder: Device model, OS version, and browser name
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: What steps led to the issue?
      placeholder: |
        1. Open camera for Sedan template
        2. Tap capture button
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually occurred?
    validations:
      required: true
