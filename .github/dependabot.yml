version: 2
updates:
  # Maintain dependencies for npm packages
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      lint-and-test:
        patterns:
          - "eslint*"
          - "prettier*"
          - "vitest*"
          - "@testing-library*"
          - "@types/*"
      production-deps:
        patterns:
          - "react*"
          - "lucide-react"
          - "idb"
          - "jszip"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
